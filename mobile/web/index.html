  <!-- Trava Transit Voice Announcement Engine with Transit Station Chime -->
  <script>
    (function() {
      let audioCtx = null;
      function playTransitChime() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return Promise.resolve();
          if (!audioCtx) audioCtx = new AudioContext();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          
          const now = audioCtx.currentTime;
          // Dual Chime: D5 (587.33 Hz) -> A5 (880.0 Hz)
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.35);

          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880.0, now + 0.2);
          gain2.gain.setValueAtTime(0.25, now + 0.2);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start(now + 0.2);
          osc2.stop(now + 0.6);

          return new Promise(r => setTimeout(r, 650));
        } catch (e) {
          console.warn('Transit chime exception:', e);
          return Promise.resolve();
        }
      }

      let currentAudio = null;

      function stopAllAudio() {
        if (currentAudio) {
          try {
            currentAudio.pause();
            currentAudio.currentTime = 0;
          } catch (_) {}
          currentAudio = null;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }

      function getFemaleVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        const femaleKeywords = ['zira', 'heera', 'neerja', 'veena', 'female', 'susan', 'hazel', 'catherine', 'girl', 'woman'];
        for (const v of voices) {
          const vName = (v.name || '').toLowerCase();
          if (femaleKeywords.some(k => vName.includes(k))) return v;
        }
        return voices.find(v => (v.lang || '').toLowerCase().startsWith('en-in')) || 
               voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;
      }

      function transliterateTamilPhonetic(tamilText) {
        let txt = tamilText;
        txt = txt.replace(/பயணிகள்\s*கவனத்திற்கு\.?/g, 'Payanigal gavanathirku.');
        txt = txt.replace(/காந்திபுரம்/g, 'Gandhipuram');
        txt = txt.replace(/சிங்காநல்லூர்/g, 'Singanalloor');
        txt = txt.replace(/பீளமேடு/g, 'Peelamedu');
        txt = txt.replace(/ஃபன்\s*மால்/g, 'Fun Mall');
        txt = txt.replace(/ஹோப்ஸ்/g, 'Hopes');
        txt = txt.replace(/லட்சுமி\s*மில்ஸ்/g, 'Lakshmi Mills');
        txt = txt.replace(/ராமநாதபுரம்/g, 'Ramanathapuram');
        txt = txt.replace(/சுந்தராபுரம்/g, 'Sundarapuram');
        txt = txt.replace(/உக்கடம்/g, 'Ukkadam');
        txt = txt.replace(/ரயில்\s*நிலையம்/g, 'Railway Station');
        txt = txt.replace(/செல்லும்\s*பேருந்து/g, 'sellum perundhu');
        txt = txt.replace(/இன்னும்/g, 'innum');
        txt = txt.replace(/நிமிடங்களில்\s*வந்து\s*சேரும்\.?/g, 'nimidangalil vandhu serum.');
        txt = txt.replace(/வந்து\s*சேரும்\.?/g, 'vandhu serum.');
        return txt;
      }

      function getApiBase() {
        if (typeof window !== 'undefined' && window.location && window.location.origin && window.location.origin.startsWith('http')) {
          return window.location.origin;
        }
        return '';
      }

      function speakFemaleAudio(text, lang) {
        return new Promise((resolve) => {
          stopAllAudio();
          const cleanText = (text || '').trim();
          if (!cleanText) return resolve();
          const encoded = encodeURIComponent(cleanText);
          const langCode = (lang === 'ta' || lang === 'ta-IN' || lang === 'tamil') ? 'ta' : 'en';
          const origin = getApiBase();
          const urls = [
            `${origin}/api/v1/tts?text=${encoded}&lang=${langCode}`,
            `${origin}/api/tts?text=${encoded}&lang=${langCode}`,
            `/api/v1/tts?text=${encoded}&lang=${langCode}`
          ];
          let urlIdx = 0;

          const audio = new Audio();
          audio.crossOrigin = 'anonymous';
          currentAudio = audio;
          let hasEnded = false;

          const finish = () => {
            if (!hasEnded) {
              hasEnded = true;
              currentAudio = null;
              resolve();
            }
          };

          audio.onended = finish;
          audio.onerror = () => {
            urlIdx++;
            if (urlIdx < urls.length) {
              audio.src = urls[urlIdx];
              audio.play().catch(() => audio.onerror());
            } else {
              speakSynthesisFallback(cleanText, langCode).then(finish);
            }
          };

          audio.src = urls[0];
          audio.play().catch(() => audio.onerror());
        });
      }

      function speakSynthesisFallback(text, lang) {
        return new Promise((resolve) => {
          if (!('speechSynthesis' in window)) return resolve();
          const isTamil = (lang === 'ta' || lang === 'ta-IN' || lang === 'tamil');
          const voices = window.speechSynthesis.getVoices();
          let textToSpeak = text;
          let voiceToUse = null;

          if (isTamil) {
            const taVoice = voices.find(v => {
              const n = (v.name || '').toLowerCase();
              const l = (v.lang || '').toLowerCase();
              return l.startsWith('ta') || n.includes('pallavi') || n.includes('tamil') || n.includes('தமிழ்');
            });
            if (taVoice) {
              voiceToUse = taVoice;
            } else {
              textToSpeak = transliterateTamilPhonetic(text);
              voiceToUse = getFemaleVoice();
            }
          } else {
            voiceToUse = getFemaleVoice();
          }

          const u = new SpeechSynthesisUtterance(textToSpeak);
          u.lang = (isTamil && voiceToUse && (voiceToUse.lang || '').startsWith('ta')) ? 'ta-IN' : 'en-IN';
          u.rate = 0.90;
          u.pitch = 1.25; // Female pitch
          if (voiceToUse) u.voice = voiceToUse;
          u.onend = resolve;
          u.onerror = resolve;
          window.speechSynthesis.speak(u);
        });
      }

      window.travaPlayChime = function() {
        return playTransitChime();
      };

      window.travaSpeak = function(text, lang) {
        stopAllAudio();
        const isTamil = (lang === 'ta' || lang === 'ta-IN' || lang === 'tamil');
        playTransitChime().then(() => {
          speakFemaleAudio(text, isTamil ? 'ta' : 'en');
        });
      };

      window.travaSpeakBilingual = function(enText, taText) {
        stopAllAudio();
        playTransitChime().then(() => {
          speakFemaleAudio(enText, 'en').then(() => {
            setTimeout(() => {
              speakFemaleAudio(taText, 'ta');
            }, 380);
          });
        });
      };

      window.travaStopSpeech = function() {
        stopAllAudio();
      };
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() {
          window.speechSynthesis.getVoices();
        };
      }
    })();
  </script>
